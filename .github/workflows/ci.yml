name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned surfaces (enforced by scripts/ci-test-summary.js --check-mirror, so
# a change here without the mirror check fails CI):
#   - Runners: ubuntu-24.04 in both jobs, pinned ahead of the Oct 19, 2026
#     ubuntu-latest -> Ubuntu 26 migration; windows-latest stays floating on
#     purpose (no migration pending, and a pin would freeze its image).
#   - Actions: checkout / setup-node / cache on @v5, the node24 runtime
#     majors (node20 was removed from hosted runners on Sep 23, 2026).
#   - Node: 22 in both jobs (active LTS, maintained until Apr 2027; local
#     dev runs 24, the engines floor stays >=18).
#   - Electron binary: ELECTRON_VERSION below mirrors package-lock.json and
#     keys the cache; the mirror check fails when they drift.
env:
  ELECTRON_VERSION: "33.4.11"

jobs:
  # Fast pure-Node signal for every push: no Electron binary, no display, no
  # headless browser. Installs with --ignore-scripts (no Electron postinstall
  # download) and runs the six pure-Node suites; the bridge edge-case suite's
  # real-Electron section SKIPs on its own when the dist binary is absent.
  # This keeps automated checks on every push cheap and robust even when the
  # heavy lanes (or Actions spending itself) are unavailable.
  light:
    name: Light (pure Node)
    # Pinned ahead of the Oct 19, 2026 ubuntu-latest -> Ubuntu 26 migration
    # (actions/runner-images#14748): the image swap must never be the reason
    # a push goes red. Re-evaluate the pin deliberately, not mid-migration.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (skip Electron postinstall)
        run: npm ci --ignore-scripts

      - name: Check the suite lists have not drifted apart
        run: node scripts/ci-test-summary.js --check-mirror

      - name: Run pure-Node suites and write per-suite summary
        run: node scripts/ci-test-summary.js --light

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 is pinned (same Oct 2026 migration note as the light
        # job); windows-latest stays floating since no such transition is
        # pending for it.
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Electron's postinstall downloads the platform binary (needed by the
      # bridge edge-case suite's real-Electron section and the desktop smoke;
      # if the download fails, those layers skip gracefully rather than
      # failing the run). @electron/get picks its cache root per OS via
      # env-paths: ~/.cache/electron on Linux but %LOCALAPPDATA%\electron\Cache
      # on Windows, so both are listed or the Windows lane never hits. The
      # key uses ELECTRON_VERSION from the workflow env (mirror-checked
      # against package-lock.json) instead of a hand-copied literal.
      - name: Cache Electron binary
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ env.ELECTRON_VERSION }}

      - name: Install dependencies
        run: npm ci

      # One step runs every suite (contract, detection, storage, bridge edge
      # cases, CLI, desktop smoke, extension E2E), streams each suite's live
      # output into the job log, and appends a per-suite results table to the
      # run's step summary. Both browser-dependent E2Es run under xvfb on
      # Linux; their harnesses skip gracefully when no suitable browser
      # exists (e.g. a failed Electron download) instead of failing.
      - name: Run all suites and write per-suite summary (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/ci-test-summary.js

      - name: Run all suites and write per-suite summary (Windows)
        if: runner.os == 'Windows'
        run: node scripts/ci-test-summary.js
