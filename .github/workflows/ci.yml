name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron's postinstall downloads the platform binary. It is needed by
      # the bridge edge-case suite (spawns the real app) and the desktop smoke
      # test; if the download fails, those layers skip gracefully rather than
      # failing the run.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-33.4.11

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: npm test

      - name: Desktop smoke test (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node run-desktop-bridge.js

      - name: Desktop smoke test (Windows)
        if: runner.os == 'Windows'
        run: node run-desktop-bridge.js
