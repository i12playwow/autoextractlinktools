name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron's postinstall downloads the platform binary. It is needed by
      # the bridge edge-case suite (spawns the real app) and the desktop smoke
      # test; if the download fails, those layers skip gracefully rather than
      # failing the run.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-33.4.11

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: npm test

      - name: Desktop smoke test (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node run-desktop-bridge.js

      - name: Desktop smoke test (Windows)
        if: runner.os == 'Windows'
        run: node run-desktop-bridge.js

      # Loads the packed extension (chrome-extension-packed/, rebuilt by the
      # test itself) into a headless Chromium-family browser, opens the stub
      # test page on localhost, and asserts the content script -> background
      # worker -> bridge (localhost:3456) delivery end to end. Branded Chrome
      # builds restrict --load-extension, so the harness tries Chromium,
      # Chrome, and Edge and fails only if none delivers. Skips when no
      # Chromium-family browser is installed.
      - name: Extension E2E (headless browser, Linux under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node test-extension-e2e.js

      - name: Extension E2E (headless browser, Windows)
        if: runner.os == 'Windows'
        run: node test-extension-e2e.js
